[package]
name = "pallet-creator-staking-rpc"
version = "0.3.0"
authors = ["DappForce <dappforce@pm.me>"]
edition = "2021"
license = "GPL-3.0-only"
homepage = "https://subsocial.network"
repository = "https://github.com/dappforce/subsocial-parachain"
description = "RPC interface for the creator staking pallet."
keywords = ["blockchain", "cryptocurrency", "social-network", "news-feed", "marketplace"]
categories = ["cryptography::cryptocurrencies"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
parity-scale-codec = { workspace = true }
jsonrpsee = { workspace = true, features = ["client-core", "server", "macros"] }

pallet-creator-staking-rpc-runtime-api = { workspace = true, features = ["default"] }
pallet-creator-staking = { workspace = true, features = ["default"] }

sp-api = { workspace = true }
sp-blockchain = { workspace = true }
sp-rpc = { workspace = true }
sp-runtime = { workspace = true }
