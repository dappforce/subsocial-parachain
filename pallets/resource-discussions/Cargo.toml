[package]
name = "pallet-resource-discussions"
version = "0.3.0"
authors = ["DappForce <dappforce@pm.me>"]
edition.workspace = true
license = "GPL-3.0-only"
homepage = "https://subsocial.network"
repository = "https://github.com/dappforce/subsocial-parachain"
description = "Pallet for commenting on external resources."
keywords = ["blockchain", "cryptocurrency", "social-network", "news-feed", "marketplace"]
categories = ["cryptography::cryptocurrencies"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
parity-scale-codec = { workspace = true, features = ["derive"] }
scale-info = { workspace = true, features = ["derive"] }

frame-benchmarking = { optional = true, workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
pallet-posts = { workspace = true }
pallet-spaces = { workspace = true }
subsocial-support = { workspace = true }

[dev-dependencies]
sp-io = { workspace = true }
sp-core = { workspace = true }
pallet-balances = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-permissions = { workspace = true }
pallet-space-follows = { workspace = true }

[features]
default = ["std"]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "frame-benchmarking/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-posts/std",
    "pallet-spaces/std",
    "sp-runtime/std",
    "sp-std/std",
    # Tests related
    "pallet-balances/std",
    "pallet-timestamp/std",
    "pallet-permissions/std",
    "pallet-space-follows/std",
]
try-runtime = ["frame-support/try-runtime"]
