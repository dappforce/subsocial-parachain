[package]
name = "subsocial-parachain-runtime"
version = "0.3.0"
authors = ["DappForce <dappforce@pm.me>"]
edition.workspace = true
license = "GPL-3.0-only"
homepage = "https://subsocial.network"
repository = "https://github.com/dappforce/subsocial-parachain"
description = "Subsocial parachain runtime"
keywords = ["blockchain", "cryptocurrency", "social-network", "news-feed", "marketplace"]
categories = ["cryptography::cryptocurrencies"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true }

[dependencies]
parity-scale-codec = { workspace = true, features = ["derive"] }
hex-literal = { workspace = true, optional = true }
log = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
smallvec = { workspace = true }

# Try-Runtime
frame-try-runtime = { workspace = true, optional = true }

# Benchmark
frame-benchmarking = { workspace = true, optional = true }
frame-system-benchmarking = { workspace = true, optional = true }

# Local
pallet-account-follows = { workspace = true }
pallet-creator-staking = { workspace = true }
pallet-domains = { workspace = true }
pallet-energy = { workspace = true }
pallet-permissions = { workspace = true }
pallet-post-follows = { workspace = true }
pallet-posts = { workspace = true }
pallet-profiles = { workspace = true }
pallet-reactions = { workspace = true }
pallet-resource-discussions = { workspace = true }
pallet-roles = { workspace = true }
pallet-space-follows = { workspace = true }
pallet-ownership = { workspace = true }
pallet-spaces = { workspace = true }
subsocial-support = { workspace = true }
pallet-free-proxy = { workspace = true }
pallet-evm-addresses = { workspace = true }

# Substrate
frame-executive = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-system-rpc-runtime-api = { workspace = true }
pallet-aura = { workspace = true }
pallet-authorship = { workspace = true }
pallet-balances = { workspace = true }
pallet-multisig = { workspace = true }
pallet-session = { workspace = true }
pallet-sudo = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
pallet-treasury = { workspace = true }
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-aura = { workspace = true }
sp-core = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = { workspace = true }
sp-session = { workspace = true }
sp-std = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }

pallet-proxy = { workspace = true }
pallet-vesting = { workspace = true }
pallet-utility = { workspace = true }
pallet-insecure-randomness-collective-flip = { workspace = true }

# Polkadot
pallet-xcm = { workspace = true }
polkadot-parachain = { workspace = true }
polkadot-primitives = { workspace = true }
polkadot-runtime-common = { workspace = true }
xcm = { workspace = true }
xcm-builder = { workspace = true }
xcm-executor = { workspace = true }

# Cumulus
cumulus-pallet-aura-ext = { workspace = true }
cumulus-pallet-dmp-queue = { workspace = true }
cumulus-pallet-parachain-system = { workspace = true }
cumulus-pallet-session-benchmarking = { workspace = true }
cumulus-pallet-xcm = { workspace = true }
cumulus-pallet-xcmp-queue = { workspace = true }
cumulus-primitives-core = { workspace = true }
cumulus-primitives-timestamp = { workspace = true }
cumulus-primitives-utility = { workspace = true }
pallet-collator-selection = { workspace = true }
parachain-info = { workspace = true }

# Custom Runtime API
pallet-creator-staking-rpc-runtime-api = { workspace = true }
pallet-domains-rpc-runtime-api = { workspace = true }
pallet-posts-rpc-runtime-api = { workspace = true }

